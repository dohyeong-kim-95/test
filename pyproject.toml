[project]
name = "bit70-scorer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PIE"]

[tool.pytest.ini_options]
testpaths = ["test_scorer.py"]
addopts = "-q"
